# NIG's nine operational clusters, as named by the company (spec 12 §3.8). Display order.
clusters:
  - code: FIN
    name: Finance
    description: Planning, recording and reporting money - budgets, invoices, costs and the monthly close.
    keywords: [invoice, accounts payable, accounts receivable, month-end close, cost review, budget, cost forecast, general ledger, expense claim, variance, audit]
  - code: HR
    name: People & HR
    description: Hiring, paying and developing employees, from the first offer to the last working day.
    keywords: [hiring, recruiting, new hire, employee onboarding, offboarding, payroll, performance review, leave request, training plan, job offer, headcount]
  - code: LEG
    name: Legal
    description: Contracts, legal advice, disputes and keeping the company within the law.
    keywords: [contract review, nda, legal opinion, litigation, compliance check, data protection, gdpr, trademark, power of attorney]
  - code: IT
    name: IT & Security
    description: Running laptops, accounts, software and networks, and keeping them safe from attack.
    keywords: [access request, password reset, service desk, incident ticket, laptop, software licence, patch, vulnerability, backup, user account]
  - code: PRO
    name: Procurement
    description: Buying goods and services - choosing suppliers, ordering and receiving what was bought.
    keywords: [purchase order, purchase requisition, supplier onboarding, supplier contract, tender, rfq, vendor, sourcing, goods receipt]
  - code: COM
    name: Comms & Growth
    description: Telling the company's story inside and outside - press, internal news, the brand and the website.
    keywords: [press release, newsletter, internal communication, intranet, social media, brand guideline, website update, town hall]
  - code: KNW
    name: Knowledge & Ops
    description: Running day-to-day operations and keeping procedures, project records and lessons learned usable.
    keywords: [procedure update, knowledge base, lessons learned, site report, shift handover, maintenance plan, project documentation, work instruction, inspection]
  - code: ANL
    name: Analytics & Strategy
    description: Turning data into decisions - dashboards, analyses, business cases and the strategy plan.
    keywords: [dashboard, kpi, data analysis, market analysis, business case, board pack, benchmark, strategy plan]
  - code: GWT
    name: Sales & Marketing
    description: Finding and winning customers - leads, offers, bids, campaigns and the customer relationship.
    keywords: [sales lead, sales pipeline, quotation, bid, customer proposal, crm, marketing campaign, client onboarding, pricing]
