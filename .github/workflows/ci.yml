# CI: lint and tests on every push and pull request (spec 10 §3.10). Deploy jobs come in spec 50.
name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make setup
      - run: make lint
      - run: make test
