# azure.yaml: azd project file for the Discovery Agent (spec 25 §3.3).
#
# Why it exists: lets `azd up` / `azd provision` deploy infra/main.bicep into the
#   EXISTING resource group rg-northstar-discovery (azd env AZURE_RESOURCE_GROUP,
#   D2), and `azd deploy` build the one image with local Docker (D4), push it to
#   the registry and set it on the container app tagged azd-service-name: app.
# What it creates: nothing by itself; infra/main.bicep says what is deployed.
#   `pipeline` tells `azd pipeline config` which azd values become GitHub
#   variables and secrets (spec 25 §3.12).
# What it must not do: never run `azd down` on this environment; it deletes the
#   resource group with the hand-made AI account and its quota (D8).
# WORKSPACE_OPEN (amended 2026-11-20, open workspace) is a pipeline variable;
#   unset means the open demo workspace.
# Acceptance criteria: AC-25.21, AC-25.30.
name: discovery-agent
infra:
  provider: bicep
  path: infra
  module: main
services:
  app: # tag azd-service-name: app on the container app
    project: .
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: false # D4: Docker on the machine that runs azd
      buildArgs:
        - APP_VERSION=${APP_VERSION}
pipeline:
  provider: github
  variables: [AZURE_RESOURCE_GROUP, MIN_REPLICAS, DEVELOPER_PRINCIPAL_ID, WORKSPACE_OPEN]
  secrets: [WORKSPACE_CODE_SPECIALIST, WORKSPACE_CODE_ENGINEER, WORKSPACE_TOKEN_SECRET]
